<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn Taken</title>
  <style>
:root {
  --bg: #ffffff; --bg2: #f7f7f5; --bg3: #efefec; --fg: #37352f; --muted: #787774;
  --border: #e3e2de; --accent: #2383e2; --danger: #d44c47;
  --p-laag: #9b9a97; --p-normaal: #2383e2; --p-hoog: #d9730d; --p-urgent: #d44c47;
  --shadow: 0 4px 18px rgba(0,0,0,.12);
}
[data-theme="dark"] {
  --bg: #191919; --bg2: #202020; --bg3: #2c2c2c; --fg: #e6e6e4; --muted: #9b9b98;
  --border: #373737; --accent: #4a9eef; --danger: #ef6b66;
  --shadow: 0 4px 18px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); }
button, input, select, textarea { font: inherit; color: inherit; }
button, .btn-like { cursor: pointer; border: 1px solid var(--border); background: var(--bg2); border-radius: 6px; padding: 6px 10px; }
button:hover, .btn-like:hover { background: var(--bg3); }
button.ghost, .ghost { background: transparent; border-color: transparent; }
button.danger { color: var(--danger); background: transparent; }
input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.spacer { flex: 1; }
.muted { color: var(--muted); font-weight: normal; }
.small { font-size: 12px; }

.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.topbar h1 { font-size: 18px; margin: 0 12px 0 0; }
.view-switch { display: flex; gap: 2px; background: var(--bg3); padding: 3px; border-radius: 8px; }
.view-switch button { border: none; background: transparent; }
.view-switch button.active { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

.toolbar { padding: 12px 20px; display: flex; flex-direction: column; gap: 10px; }
#quickAdd { display: flex; gap: 8px; }
#quickAdd input { flex: 1; min-width: 0; font-size: 16px; padding: 9px 12px; }
#quickAdd button { background: var(--accent); color: #fff; border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input[type=search] { min-width: 200px; flex: 1; }
.chk { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; }

main { padding: 0 20px 40px; }
.empty { text-align: center; color: var(--muted); padding: 50px 0; }

/* Lijst */
.group h2 { font-size: 14px; color: var(--muted); margin: 18px 0 6px; display: flex; gap: 8px; align-items: center; }
.row { display: grid; grid-template-columns: 28px 1fr auto auto auto; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 4px; }
.row:hover { background: var(--bg2); }
.row.done .title { text-decoration: line-through; color: var(--muted); }
.row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.check { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

.badge { font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--bg3); white-space: nowrap; }
.prio { color: #fff; }
.prio-Laag { background: var(--p-laag); } .prio-Normaal { background: var(--p-normaal); }
.prio-Hoog { background: var(--p-hoog); } .prio-Urgent { background: var(--p-urgent); }
.due.overdue { color: #fff; background: var(--danger); }
.due.today { color: #fff; background: var(--p-hoog); }
.label { background: hsl(var(--h) 70% 88%); color: hsl(var(--h) 50% 28%); }
[data-theme="dark"] .label { background: hsl(var(--h) 35% 28%); color: hsl(var(--h) 70% 85%); }

/* Bord */
.board { display: grid; grid-template-columns: repeat(3, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; }
.col { background: var(--bg2); border-radius: 8px; padding: 10px; min-height: 200px; }
.col.over { outline: 2px dashed var(--accent); }
.col h2 { font-size: 14px; margin: 0 0 10px; display: flex; gap: 6px; align-items: center; }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; margin-bottom: 8px; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.card:hover { border-color: var(--accent); }
.card.dragging { opacity: .4; }
.card .title { font-weight: 500; margin-bottom: 6px; }
.card .meta { display: flex; gap: 5px; flex-wrap: wrap; }
.col .add-in-col { width: 100%; text-align: left; color: var(--muted); background: transparent; border: none; }

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot-todo { background: var(--p-laag); } .dot-doing { background: var(--accent); } .dot-done { background: #4dab9a; }

/* Zijpaneel */
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--bg); border-left: 1px solid var(--border); box-shadow: var(--shadow); padding: 14px 24px 30px; overflow-y: auto; z-index: 20; }
#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 10; }
.panel-head { display: flex; align-items: center; margin-bottom: 8px; }
.p-title { width: 100%; font-size: 24px; font-weight: 700; border: none; padding: 4px 0; margin-bottom: 12px; }
.props { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; align-items: start; }
.props > label { color: var(--muted); padding-top: 6px; font-size: 14px; }
.labels { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.labels .badge button { border: none; background: none; padding: 0 0 0 4px; color: inherit; }
.panel h3 { font-size: 15px; margin: 22px 0 8px; }
.progress { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.progress div { height: 100%; background: #4dab9a; width: 0; transition: width .2s; }
.subs { list-style: none; padding: 0; margin: 0 0 6px; }
.subs li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.subs li input[type=text] { flex: 1; border-color: transparent; padding: 3px 6px; }
.subs li input[type=text]:hover { border-color: var(--border); }
.subs li.done input[type=text] { text-decoration: line-through; color: var(--muted); }
.subs li button { border: none; background: none; color: var(--muted); padding: 2px 6px; }
#subInput { width: 100%; }
#pNotes { width: 100%; min-height: 180px; resize: vertical; }

@media (max-width: 700px) {
  .row { grid-template-columns: 28px 1fr; }
  .row .meta { grid-column: 2; justify-content: flex-start; }
  .board { grid-template-columns: repeat(3, 85vw); }
  .props { grid-template-columns: 90px 1fr; }
}

/* Zijbalk met lijsten */
.layout { display: flex; align-items: stretch; min-height: calc(100vh - 57px); }
.sidebar { width: 230px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border); padding: 14px 10px; }
.content { flex: 1; min-width: 0; }
.side-title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0 8px 6px; }
#listNav { list-style: none; margin: 0; padding: 0; }
#listNav li { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
#listNav li:hover { background: var(--bg3); }
#listNav li.active { background: var(--bg3); font-weight: 600; }
#listNav li.drop-over { outline: 2px dashed var(--accent); }
#listNav .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#listNav .count { color: var(--muted); font-size: 12px; }
#listNav .acts { display: none; }
#listNav li:hover .acts { display: inline-flex; }
#listNav .acts button { border: none; background: none; padding: 0 3px; color: var(--muted); font-size: 13px; }
#listNav .sep { height: 1px; background: var(--border); margin: 6px 8px; padding: 0; cursor: default; }
.add-list { width: 100%; text-align: left; color: var(--muted); margin-top: 4px; }
.list-heading { margin: 16px 20px 0; font-size: 26px; }
#menuBtn { display: none; font-size: 18px; }
#sideBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 14; }

/* Kalender */
.cal-head { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
.cal-head h2 { font-size: 18px; margin: 0 8px 0 0; text-transform: capitalize; min-width: 170px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
.cal .dow { font-size: 12px; color: var(--muted); padding: 4px 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--bg2); }
.day { min-height: 105px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px; cursor: pointer; overflow: hidden; }
.day:hover { background: var(--bg2); }
.day.other { background: var(--bg2); color: var(--muted); }
.day.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.day .num { font-size: 12px; display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 11px; margin-bottom: 2px; }
.day.today .num { background: var(--danger); color: #fff; font-weight: 600; }
.chip { font-size: 12px; padding: 2px 6px; margin-bottom: 3px; border-radius: 4px; background: var(--bg3); border-left: 3px solid var(--p-normaal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; }
.chip.p-Laag { border-color: var(--p-laag); } .chip.p-Hoog { border-color: var(--p-hoog); } .chip.p-Urgent { border-color: var(--p-urgent); }
.chip.done { text-decoration: line-through; color: var(--muted); }
.no-due { margin-top: 16px; }
.no-due h3 { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
.no-due .chip { display: inline-block; margin-right: 6px; max-width: 260px; }

@media (max-width: 700px) {
  #menuBtn { display: inline-block; }
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 15; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  #listNav .acts { display: inline-flex; }
  .topbar { padding: 8px 12px; }
  .toolbar { padding: 10px 12px; }
  main { padding: 0 12px 40px; }
  .list-heading { margin: 12px 12px 0; font-size: 22px; }
  .day { min-height: 64px; padding: 2px; }
  .chip { font-size: 10px; padding: 1px 3px; }
  .cal-head h2 { min-width: 0; font-size: 16px; }
}

@media (max-width: 700px) {
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .lbl { display: none; }
  .view-switch { order: 10; width: 100%; }
  .view-switch button { flex: 1; padding: 6px 4px; }
  .filters input[type=search] { min-width: 100%; }
  .filters select { flex: 1 1 45%; min-width: 0; }
}

</style>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="ghost" title="Lijsten tonen">☰</button>
    <h1>📋 Mijn Taken</h1>
    <div class="view-switch" role="tablist">
      <button data-view="list" class="active">☰ Lijst</button>
      <button data-view="board">▦ Bord</button>
      <button data-view="calendar">📅 Kalender</button>
    </div>
    <div class="spacer"></div>
    <button id="exportBtn" class="ghost" title="Back-up downloaden">⬇<span class="lbl"> Export</span></button>
    <label class="ghost btn-like" title="Back-up terugzetten">⬆<span class="lbl"> Import</span><input id="importInput" type="file" accept=".json" hidden></label>
    <button id="syncBtn" class="ghost">☁ Inloggen</button>
    <button id="themeBtn" class="ghost" title="Donkere / lichte modus">🌙</button>
  </header>

  <div class="layout">
  <nav id="sidebar" class="sidebar">
    <div class="side-title">Lijsten</div>
    <ul id="listNav"></ul>
    <button id="addList" class="ghost add-list">+ Nieuwe lijst</button>
  </nav>
  <div class="content">
  <h2 id="listHeading" class="list-heading"></h2>
  <section class="toolbar">
    <form id="quickAdd" autocomplete="off">
      <input id="quickTitle" placeholder="+ Nieuwe taak… (Enter)" required>
      <button type="submit">Toevoegen</button>
    </form>
    <div class="filters">
      <input id="search" type="search" placeholder="🔍 Zoeken…">
      <select id="fStatus"><option value="">Alle statussen</option></select>
      <select id="fPrio"><option value="">Alle prioriteiten</option></select>
      <select id="fLabel"><option value="">Alle labels</option></select>
      <select id="sortBy">
        <option value="created">Sorteer: nieuwste</option>
        <option value="due">Sorteer: deadline</option>
        <option value="prio">Sorteer: prioriteit</option>
        <option value="title">Sorteer: titel</option>
      </select>
      <label class="chk"><input id="hideDone" type="checkbox"> Verberg afgerond</label>
    </div>
  </section>

  <main id="main"></main>
  </div>
  </div>

  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <button id="closePanel" class="ghost" title="Sluiten (Esc)">✕</button>
      <div class="spacer"></div>
      <button id="deleteTask" class="danger">🗑 Verwijderen</button>
    </div>
    <input id="pTitle" class="p-title" placeholder="Titel">
    <div class="props">
      <label>Lijst</label><select id="pList"></select>
      <label>Status</label><select id="pStatus"></select>
      <label>Prioriteit</label><select id="pPrio"></select>
      <label>Deadline</label><input id="pDue" type="date">
      <label>Labels</label>
      <div>
        <div id="pLabels" class="labels"></div>
        <input id="pLabelInput" placeholder="Label toevoegen + Enter" list="labelList">
        <datalist id="labelList"></datalist>
      </div>
    </div>
    <h3>Subtaken <span id="subCount" class="muted"></span></h3>
    <div class="progress"><div id="subBar"></div></div>
    <ul id="pSubs" class="subs"></ul>
    <form id="subAdd" autocomplete="off"><input id="subInput" placeholder="+ Subtaak toevoegen"></form>
    <h3>Notities</h3>
    <textarea id="pNotes" placeholder="Schrijf hier notities, links, ideeën…"></textarea>
    <p class="muted small" id="pMeta"></p>
  </aside>
  <div id="backdrop" hidden></div>
  <div id="sideBackdrop" hidden></div>

  <script>
// Mijn Taken — eenvoudige Notion-achtige takenapp. Alle data blijft in de browser (localStorage).
'use strict';

const STORE_KEY = 'mijn-taken-v1';
const THEME_KEY = 'mijn-taken-theme';
const STATUSES = [
  { id: 'todo', name: 'Te doen' },
  { id: 'doing', name: 'Bezig' },
  { id: 'done', name: 'Klaar' },
];
const PRIOS = ['Urgent', 'Hoog', 'Normaal', 'Laag'];

const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- Data ----------
let state = load();
let view = localStorage.getItem('mijn-taken-view') || 'list';
let openId = null;
let currentList = localStorage.getItem('mijn-taken-list') || 'all';
let calMonth = (() => { const x = new Date(); return new Date(x.getFullYear(), x.getMonth(), 1); })();
migrate();
if (currentList !== 'all' && !state.lists.some((l) => l.id === currentList)) currentList = 'all';

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && Array.isArray(d.tasks)) return d;
  } catch (_) {}
  const lists = [{ id: 'inbox', name: 'Inbox', icon: '📥' }, { id: 'werk', name: 'Werk', icon: '💼' }, { id: 'prive', name: 'Privé', icon: '🏠' }];
  return { lists, tasks: demoTasks() };
}
// Oudere data (zonder lijsten) omzetten: alles komt in "Inbox".
function migrate() {
  if (!Array.isArray(state.lists) || !state.lists.length) state.lists = [{ id: 'inbox', name: 'Inbox', icon: '📥' }];
  for (const t of state.tasks) if (!t.listId || !state.lists.some((l) => l.id === t.listId)) t.listId = state.lists[0].id;
  save();
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  if (window.onLocalSave) window.onLocalSave(); // synchronisatie (sync.js)
}
// Onthoud verwijderde taken/lijsten, zodat ze bij synchroniseren niet terugkomen.
function tombstone(id) { (state.deleted ||= {})[id] = Date.now(); }

function demoTasks() {
  const d = (n) => { const x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const now = Date.now();
  return [
    { id: uid(), title: 'Welkom! Klik op een taak om details te openen', status: 'todo', prio: 'Normaal', due: '', labels: ['uitleg'], notes: 'Hier kun je notities kwijt.\n\nTip: sleep kaarten tussen kolommen in de Bord-weergave.', subtasks: [{ id: uid(), text: 'Probeer een subtaak af te vinken', done: false }, { id: uid(), text: 'Voeg een label toe', done: true }], demo: true, created: now },
    { id: uid(), title: 'Voorbeeld: boodschappen doen', status: 'doing', prio: 'Hoog', due: d(0), labels: ['privé'], listId: 'prive', notes: '', subtasks: [], demo: true, created: now - 1000 },
    { id: uid(), title: 'Voorbeeld: verslag afronden', status: 'todo', prio: 'Urgent', due: d(-1), labels: ['werk'], listId: 'werk', notes: '', subtasks: [], demo: true, created: now - 2000 },
    { id: uid(), title: 'Voorbeeld: app uitproberen', status: 'done', prio: 'Laag', due: '', labels: [], notes: '', subtasks: [], demo: true, created: now - 3000 },
  ];
}

const getTask = (id) => state.tasks.find((t) => t.id === id);
function updateTask(id, patch) {
  const t = getTask(id);
  if (!t) return;
  Object.assign(t, patch, { updated: Date.now() });
  if (patch.status) t.completedAt = patch.status === 'done' ? Date.now() : null;
  save(); render();
}
function addTask(title, extra = {}) {
  const listId = currentList === 'all' ? state.lists[0].id : currentList;
  const t = { id: uid(), title, listId, status: 'todo', prio: 'Normaal', due: '', labels: [], notes: '', subtasks: [], created: Date.now(), ...extra };
  state.tasks.push(t); save(); render();
  return t;
}
function allLabels() { return [...new Set(state.tasks.flatMap((t) => t.labels))].sort((a, b) => a.localeCompare(b)); }

// ---------- Helpers ----------
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function labelBadge(l, removable) {
  const b = el('span', { class: 'badge label', style: `--h:${hue(l)}` }, l);
  if (removable) b.append(el('button', { title: 'Verwijderen', onclick: () => {
    const t = getTask(openId); updateTask(openId, { labels: t.labels.filter((x) => x !== l) }); fillPanel();
  } }, '×'));
  return b;
}
function todayStr() { const x = new Date(); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function dueBadge(t) {
  if (!t.due) return null;
  const today = todayStr();
  let cls = 'badge due';
  if (t.status !== 'done') { if (t.due < today) cls += ' overdue'; else if (t.due === today) cls += ' today'; }
  const [y, m, dd] = t.due.split('-');
  const txt = t.due === today ? 'Vandaag' : new Date(+y, m - 1, +dd).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  return el('span', { class: cls, title: 'Deadline' }, '📅 ' + txt);
}
function metaBadges(t) {
  const subs = t.subtasks.length ? el('span', { class: 'badge', title: 'Subtaken' }, `☑ ${t.subtasks.filter((s) => s.done).length}/${t.subtasks.length}`) : null;
  const notes = t.notes.trim() ? el('span', { class: 'badge', title: 'Heeft notities' }, '📝') : null;
  return [...t.labels.map((l) => labelBadge(l)), subs, notes, dueBadge(t), el('span', { class: `badge prio prio-${t.prio}` }, t.prio)];
}
const statusDot = (id) => el('span', { class: `dot dot-${id}` });

// ---------- Filteren & sorteren ----------
function filtered() {
  const q = $('#search').value.trim().toLowerCase();
  const fs = $('#fStatus').value, fp = $('#fPrio').value, fl = $('#fLabel').value;
  const hide = $('#hideDone').checked;
  let list = state.tasks.filter((t) => {
    if (currentList !== 'all' && t.listId !== currentList) return false;
    if (fs && t.status !== fs) return false;
    if (fp && t.prio !== fp) return false;
    if (fl && !t.labels.includes(fl)) return false;
    if (hide && t.status === 'done') return false;
    if (q) {
      const hay = [t.title, t.notes, ...t.labels, ...t.subtasks.map((s) => s.text)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const by = $('#sortBy').value;
  const cmp = {
    created: (a, b) => b.created - a.created,
    due: (a, b) => (a.due || '9999').localeCompare(b.due || '9999'),
    prio: (a, b) => PRIOS.indexOf(a.prio) - PRIOS.indexOf(b.prio),
    title: (a, b) => a.title.localeCompare(b.title),
  }[by];
  return list.sort(cmp);
}

// ---------- Weergaven ----------
function render() {
  document.querySelectorAll('.view-switch button').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  refreshLabelFilter();
  renderSidebar();
  const cur = state.lists.find((l) => l.id === currentList);

function renderCalendar(main, list) {

  <script>
// Synchronisatie tussen apparaten via Supabase (gratis). Werkt zonder extra bibliotheken.
// Vul hieronder je eigen Project URL en anon/publishable key in. Leeg = synchronisatie uit.
'use strict';

const SUPABASE_URL = 'https://loalyqqjotkfqpiquflc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_s2FCki8DhszsfiEc6a0x4A_6jNZ6qt-';

(() => {
  const btn = document.getElementById('syncBtn');
  if (!SUPABASE_URL || !SUPABASE_KEY) { btn.hidden = true; return; }

  const AUTH_KEY = 'mijn-taken-auth';
  let session = null;   // { access_token, refresh_token, expires_at, email, user_id }
  let busy = false, again = false, timer = null, lastSync = null, lastError = '';

  const api = (path, opts = {}) => fetch(SUPABASE_URL.replace(/\/$/, '') + path, {
    ...opts,

  });
  function jwtPayload(tok) {
    try { return JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (_) { return {}; }
  }
  function setSession(tokens) {
    const p = jwtPayload(tokens.access_token);

      access_token: tokens.access_token, refresh_token: tokens.refresh_token,
      expires_at: p.exp ? p.exp * 1000 : Date.now() + 3600e3, email: p.email || '', user_id: p.sub,
    };

  }

    session = null; localStorage.removeItem(AUTH_KEY); updateButton();
  }

    if (!session) return null;

  }
  async function sendLink(email) {

  }

  function readLinkFromUrl() {
    const h = new URLSearchParams(location.hash.slice(1));

    if (h.get('access_token')) setSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token') });
    if (h.get('access_token') || h.get('error')) history.replaceState(null, '', location.pathname + location.search);

  // ---------- Samenvoegen ----------
  const stamp = (x) => x.updated || x.created || 0;
  function merge(a, b) {

      const local = remote ? { ...state, tasks: state.tasks.filter((t) => !(t.demo && !t.updated)) } : state;

    }

    if (!email) return;
